name: ci
on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # The desktop shell needs system WebView libraries; it is built in the app job.
      - run: cargo clippy --workspace --exclude confluo-app --all-targets -- -D warnings
      - run: cargo test --workspace --exclude confluo-app
      # Files past 4 GiB: slow, so only where disk and time are plentiful.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo test --release -p confluo-engine --test stress -- --ignored
      - run: node --check extension/background.js && node --check extension/options.js && node --check site/main.js

  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm typecheck && pnpm lint
        working-directory: app
      - run: pnpm tauri build
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: confluo-windows
          path: target/release/bundle/nsis/*.exe
