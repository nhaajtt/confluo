[package]
name = "weft-engine"
version = "0.1.0"
edition.workspace = true

[dependencies]
base64 = "0.23.1"
bytes = "1.12.1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
md-5 = "0.11.0"
percent-encoding = "2.3.2"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1.44"
url = "2.5.8"
webpki-roots = "1.0.12"
weft-net = { version = "0.1.0", path = "../weft-net" }

[dev-dependencies]
proptest = "1.12.0"
sha2 = "0.11.1"
tempfile = "3.27.0"
url = "2.5.8"
weft-net = { path = "../weft-net" }
weft-testsrv = { path = "../weft-testsrv" }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_IO", "Win32_System_Ioctl", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security_Cryptography"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[lints]
workspace = true
