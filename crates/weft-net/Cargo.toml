[package]
name = "weft-net"
version = "0.1.0"
edition.workspace = true

[dependencies]
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "rt", "time", "macros", "sync"] }
tracing = "0.1.44"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Networking_WinSock", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Foundation"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[lints]
workspace = true
