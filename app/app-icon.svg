<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Confluo's mark: an octopus. Many arms, each pulling its own share, all feeding one body. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17171c"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4ff8f"/>
      <stop offset="1" stop-color="#d6f22a"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="110.500" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="3"/>
  <g fill="none" stroke-linecap="round" stroke-width="46">
    <!-- outer arms, curling outward at the tips -->
    <path d="M188 276 C 170 350, 150 392, 104 396 C 74 398, 66 366, 88 356" stroke="#ff3fa4"/>
    <path d="M324 276 C 342 350, 362 392, 408 396 C 438 398, 446 366, 424 356" stroke="#ff3fa4"/>
    <!-- inner arms -->
    <path d="M226 290 C 222 352, 214 400, 186 436" stroke="#e4ff3d"/>
    <path d="M286 290 C 290 352, 298 400, 326 436" stroke="#e4ff3d"/>
  </g>
  <!-- the body all arms feed -->
  <path d="M256 70 C 342 70, 398 132, 398 208 C 398 268, 356 312, 256 312 C 156 312, 114 268, 114 208 C 114 132, 170 70, 256 70 Z" fill="url(#body)"/>
  <ellipse cx="208" cy="214" rx="21" ry="29" fill="#0a0a0c"/>
  <ellipse cx="304" cy="214" rx="21" ry="29" fill="#0a0a0c"/>
  <circle cx="215" cy="203" r="7" fill="#f4ff8f"/>
  <circle cx="311" cy="203" r="7" fill="#f4ff8f"/>
</svg>
