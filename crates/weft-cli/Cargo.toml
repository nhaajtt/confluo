[package]
name = "weft-cli"
version = "0.1.0"
edition.workspace = true

[dependencies]
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
url = "2.5.8"
weft-engine = { version = "0.1.0", path = "../weft-engine" }
