[package]
name = "confluo-cli"
version = "0.1.0"
edition.workspace = true

[dependencies]
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
url = "2.5.8"
confluo-engine = { version = "0.1.0", path = "../confluo-engine" }
confluo-net = { version = "0.1.0", path = "../confluo-net" }

[[bin]]
name = "confluo"
path = "src/main.rs"

[lints]
workspace = true
