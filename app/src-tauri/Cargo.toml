[package]
name = "confluo-app"
description = "Confluo download manager"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "confluo-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt"] }
confluo-engine = { path = "../../crates/confluo-engine" }
confluo-bridge = { path = "../../crates/confluo-bridge" }
confluo-net = { path = "../../crates/confluo-net" }

[lints]
workspace = true
